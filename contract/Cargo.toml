[package]
name = "divemarket"
version = "0.1.0"
edition = "2021"
description = "Living on-chain economy: autonomous NPCs with real treasuries, deterministic pricing, verifiable trade"
repository = "https://github.com/altair/divemarket"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }


[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["legacy", "unit-testing"] }
# Only for tests: they need to sign catch receipts the way the game server
# does. The contract itself verifies with the runtime's built-in
# ed25519_verify, so it carries no crypto crate into the wasm build.
near-crypto = "0.30"
